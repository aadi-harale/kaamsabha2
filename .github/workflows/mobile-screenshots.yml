name: Capture Mobile Screenshots

on:
  push:
    branches: [mobile-expo]
    paths:
      - 'mobile/scripts/capture-screenshots.spec.cjs'
      - 'mobile/src/service-map.native.tsx'
      - 'mobile/src/service-map.web.tsx'
      - '.github/workflows/mobile-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-expo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Install screenshot tooling
        working-directory: mobile
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@latest
          npx playwright install --with-deps chromium
      - name: Export Expo web build
        working-directory: mobile
        run: npx expo export --platform web --output-dir dist-web
      - name: Start local web server
        working-directory: mobile
        run: |
          python3 -m http.server 4173 --directory dist-web > /tmp/kaamsabha-web.log 2>&1 &
          echo $! > /tmp/kaamsabha-web.pid
          sleep 4
      - name: Capture phone screenshots
        working-directory: mobile
        run: |
          mkdir -p docs/screenshots
          npx playwright test scripts/capture-screenshots.spec.cjs --reporter=line
      - name: Commit screenshots to mobile-expo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add KaamSabha mobile app screenshots"
            git push origin HEAD:mobile-expo
          fi
